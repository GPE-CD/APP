<style id="app-polish-v2">
  :root {

  .hero {

<script>
  (function(){
    function enhance(){
      if (!document.getElementById('page-progress')) {
        var progress=document.createElement('div');
        progress.id='page-progress';
        progress.setAttribute('aria-hidden','true');
        document.body.appendChild(progress);
      }
      if (!document.getElementById('back-to-top')) {
        var btn=document.createElement('button');
        btn.id='back-to-top';
        btn.type='button';
        btn.setAttribute('aria-label','Voltar ao topo');
        btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"/></svg>';
        btn.addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'});});
        document.body.appendChild(btn);
      }
      updateScroll();
    }
    function updateScroll(){
      var max=document.documentElement.scrollHeight-window.innerHeight;
      var pct=max>0?(window.scrollY/max)*100:0;
      var p=document.getElementById('page-progress'); if(p) p.style.width=Math.min(100,Math.max(0,pct))+'%';
      var b=document.getElementById('back-to-top'); if(b) b.classList.toggle('visible',window.scrollY>520);
    }
    document.addEventListener('DOMContentLoaded',enhance);
    window.addEventListener('scroll',updateScroll,{passive:true});
    window.addEventListener('resize',updateScroll,{passive:true});
  })();

<script id="category-tabs-v3">
(function(){

        ['Situação de proposições sobre APP','Estudo · DOCX','https://github.com/GPE-CD/APP/blob/main/01_Notas%20T%C3%A9cnicas/Situa%C3%A7%C3%A3o%20de%20proposi%C3%A7%C3%B5es%20sobre%20APP.docx']
      ]
    },
    'Memórias': {
      description: 'Registros de reuniões, atividades e marcos da trajetória do projeto.',
      items: [
        ['Ajuda Memória — 29 de fevereiro de 2024','Registro · DOCX','https://github.com/GPE-CD/APP/blob/main/02_Mem%C3%B3rias/Ajuda%20Mem%C3%B3ria%20-%20Projeto%20APP%20do%20GPE%20-%20Conle%20-%2029_02_24.docx'],
        ['Ajuda Memória — 14 de março de 2024','Registro · DOCX','https://github.com/GPE-CD/APP/blob/main/02_Mem%C3%B3rias/Ajuda%20Mem%C3%B3ria%20-%20Projeto%20APP%20do%20GPE%20-%20Conle%20-%2014_03_24.docx'],
        ['Ajuda Memória — 18 de abril de 2024','Registro · DOCX','https://github.com/GPE-CD/APP/blob/main/02_Mem%C3%B3rias/Ajuda%20Mem%C3%B3ria%20-%20Projeto%20APP%20do%20GPE%20-%20Conle%20-%2018_04_24.docx'],
        ['Memória — 19 de setembro de 2024','Registro revisado · DOCX','https://github.com/GPE-CD/APP/blob/main/02_Mem%C3%B3rias/Mem%C3%B3ria%20-%20Projeto%20APP%20do%20GPE%20-%20Conle%20-%2019_09_24%20rev.docx'],
        ['Relatório de atividades — 2023','Relatório · PDF','https://github.com/GPE-CD/APP/blob/main/02_Mem%C3%B3rias/Relat%C3%B3rio%20de%20atividades%20do%20Projeto%20APP%20-%202023%20final%20rev.pdf']
      ]
    },
    'Projetos': {
      description: 'Documentos estruturantes, propostas e produtos relacionados ao Projeto APP.',
      items: [
        ['Projeto APP — versão revisada, dezembro de 2023','Documento do projeto · PDF','https://github.com/GPE-CD/APP/blob/main/03_Projetos/Projeto%20-%20APP%20-%20rev%20dezembro%202023.pdf']
      ]
    },
    'Atividades Gerais': {
      description: 'Acessos públicos selecionados para consulta do projeto e de sua estrutura no GitHub.',
      items: [
        ['README do projeto','Apresentação e estrutura pública','https://github.com/GPE-CD/APP/blob/main/README.md'],
        ['Repositório público','Raiz pública do Projeto APP','https://github.com/GPE-CD/APP']
      ]
    }
  };

  const arrowSvg='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg>';

  function extLabel(type){
    const t=(type||'').toUpperCase();
    if(t.includes('DOCX')) return 'DOC';
    if(t.includes('PDF')) return 'PDF';
    return 'WEB';
  }

  function closeOtherPanels(list, exceptRow){
    list.querySelectorAll('.module-row.is-active').forEach(row=>{
      if(row!==exceptRow){
        row.classList.remove('is-active');
        row.setAttribute('aria-expanded','false');
        const p=row.nextElementSibling;
        if(p && p.classList.contains('category-panel')) p.classList.remove('is-open');
      }
    });
  }

  function buildPanel(row, title, data){
    const panel=document.createElement('div');
    panel.className='category-panel';
    panel.setAttribute('aria-hidden','true');
    const docs=data.items.map(item=>`
      <a class="category-doc-card" href="${item[2]}" target="_blank" rel="noreferrer">
        <span class="doc-badge">${extLabel(item[1])}</span>
        <span><strong>${item[0]}</strong><small>${item[1]}</small></span>
        <span class="doc-arrow">${arrowSvg}</span>
      </a>`).join('');
    panel.innerHTML=`<div class="category-panel-clip"><div class="category-panel-inner">
      <div class="category-panel-head">
        <div><span class="panel-label">Conteúdo da categoria</span><h3>${title}</h3><p>${data.description}</p></div>
        <span class="category-count">${data.items.length.toString().padStart(2,'0')} ${data.items.length===1?'item':'itens'}</span>
      </div>
      <div class="category-doc-grid">${docs}</div>
      <div class="category-panel-foot">
        <span>Os documentos abrem em uma nova guia para preservar sua navegação.</span>
        <button type="button" class="category-full-link">Ver página completa ${arrowSvg}</button>
      </div>
    </div></div>`;
    panel.querySelector('.category-full-link').addEventListener('click', function(){
      const ev=new MouseEvent('click',{view:window,bubbles:true,cancelable:true,button:0});
      Object.defineProperty(ev,'__categoryNavigate',{value:true});
      row.dispatchEvent(ev);
    });
    return panel;
  }

  function enhanceModuleTabs(){
    const list=document.querySelector('.full-module-list');
    if(!list || list.dataset.categoryTabs==='1') return;
    const rows=[...list.querySelectorAll(':scope > .module-row')];
    if(!rows.length) return;
    list.dataset.categoryTabs='1';
    list.classList.add('category-tabs');

    rows.forEach((row,index)=>{
      const titleEl=row.querySelector('.row-copy strong');
      const title=titleEl ? titleEl.textContent.trim() : '';
      const data=CATEGORY_DATA[title];
      if(!data) return;
      row.setAttribute('role','button');
      row.setAttribute('aria-expanded','false');
      row.setAttribute('aria-controls','category-panel-'+index);
      const action=row.querySelector('.row-action');
      if(action){
        const svg=action.querySelector('svg');
        action.childNodes.forEach(n=>{ if(n.nodeType===3) n.textContent='Explorar categoria '; });
        if(svg) svg.setAttribute('aria-hidden','true');
      }
      const panel=buildPanel(row,title,data);
      panel.id='category-panel-'+index;
      row.insertAdjacentElement('afterend',panel);

      row.addEventListener('click',function(e){
        if(e.__categoryNavigate) return;
        if(e.metaKey||e.ctrlKey||e.shiftKey||e.altKey||e.button>0) return;
        e.preventDefault();
        const willOpen=!row.classList.contains('is-active');
        closeOtherPanels(list,row);
        row.classList.toggle('is-active',willOpen);
        row.setAttribute('aria-expanded',String(willOpen));
        panel.classList.toggle('is-open',willOpen);
        panel.setAttribute('aria-hidden',String(!willOpen));
        if(willOpen && window.innerWidth<700){
          setTimeout(()=>row.scrollIntoView({behavior:'smooth',block:'start'}),80);
        }
      },true);
    });
  }

  function enhanceCatalogAccordion(){
    document.querySelectorAll('.module-detail .catalog-group').forEach((group,index)=>{
      if(group.dataset.accordion==='1') return;
      const heading=group.querySelector(':scope > .catalog-heading');
      if(!heading) return;
      group.dataset.accordion='1';
      heading.setAttribute('role','button');
      heading.setAttribute('tabindex','0');
      heading.setAttribute('aria-expanded','true');
      const rest=[...group.children].filter(el=>el!==heading);
      if(!rest.length) return;
      const shell=document.createElement('div');
      shell.className='catalog-items-shell';
      const clip=document.createElement('div');
      clip.className='catalog-items-clip';
      const inner=document.createElement('div');
      inner.className='catalog-items-inner';
      rest.forEach(el=>inner.appendChild(el));
      clip.appendChild(inner); shell.appendChild(clip); group.appendChild(shell);
      group.classList.add('accordion-open');
      const toggle=()=>{
        const open=group.classList.toggle('accordion-open');
        heading.setAttribute('aria-expanded',String(open));
      };
      heading.addEventListener('click',toggle);
      heading.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle();}});
    });
  }

  let raf=0;
  function enhance(){
    cancelAnimationFrame(raf);
    raf=requestAnimationFrame(()=>{
      enhanceModuleTabs();
      enhanceCatalogAccordion();
    });
  }
  document.addEventListener('DOMContentLoaded', enhance);
  const obs=new MutationObserver(enhance);
  obs.observe(document.documentElement,{childList:true,subtree:true});
  window.addEventListener('popstate',()=>setTimeout(enhance,20));
})();
</script>

  --line:#16364a26;
  --white:#fff;
  --institutional:#12364a;
  --institutional-deep:#0b2635;
  --institutional-light:#edf2f4;
  --gold:#b88a3d;
  --gold-soft:#d8c39c;
  --serif:Georgia,"Times New Roman",serif;
}
html{scroll-padding-top:132px}
body{background:#f6f7f5;color:#102b3b}
::selection{background:#d8c39c;color:#0b2635}
.container,.nav-shell,.hero-inner{width:min(1240px,100% - 112px)}

/* Institutional top line */
.institutional-bar{
  min-height:34px;background:var(--institutional-deep);color:#dbe4e8;
  border-bottom:1px solid #ffffff16;font-size:10px;letter-spacing:.095em;
  text-transform:uppercase;font-weight:600;display:flex;align-items:center;
}
.institutional-bar-inner{width:min(1240px,100% - 112px);margin:auto;display:flex;justify-content:space-between;gap:24px;align-items:center}
.institutional-bar strong{color:#fff;font-weight:700}.institutional-bar span:last-child{color:#aebcc3}

/* Header */
.site-header{height:88px;background:#ffffffed;border-bottom:1px solid #cfd9de;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);position:sticky;top:0;box-shadow:0 1px 0 #fff inset;z-index:50}
.site-header.has-institutional-bar{height:auto;position:sticky;top:0}
.site-header.has-institutional-bar .nav-shell{height:86px}
.brand{gap:15px;min-width:265px}
.brand-mark{width:44px;height:44px;border-radius:2px;background:var(--institutional);color:#fff;box-shadow:none;border:1px solid #0a2635;font-family:var(--sans);font-weight:700;letter-spacing:.02em}
.brand-text{gap:3px}.brand-text strong{font:700 16px/1.1 var(--serif);letter-spacing:-.015em;color:#102b3b}
.brand-text small{font:600 9px/1.2 var(--sans);letter-spacing:.11em;color:#6c7a83}
.main-nav{gap:34px;font-size:12px;font-weight:650;letter-spacing:.01em;color:#53636d}
.main-nav a{padding:33px 0 30px;position:relative}.main-nav a:hover{color:#102b3b}
.main-nav a.active:after{height:3px;background:var(--gold);bottom:0}
.nav-github{padding:11px 14px;border:1px solid #c8d2d7;border-radius:2px;background:#f8faf9;margin-left:2px}
.nav-github:hover{background:#eef2f3}

/* Hero — formal institutional masthead */
.hero{min-height:610px;background:linear-gradient(108deg,#0b2635 0%,#12364a 61%,#173e51 100%);border-bottom:4px solid var(--gold);overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:88px 100%;opacity:.23;pointer-events:none}
.hero-grid,.hero-orbit{display:none!important}.hero-inner{min-height:610px;padding:64px 0 70px;align-items:center}
.hero-copy{max-width:830px;border-left:3px solid var(--gold);padding-left:34px}
.hero .eyebrow{color:#d8c39c;font:700 10px var(--sans);letter-spacing:.18em}
.hero h1{font:700 clamp(46px,5.5vw,78px)/1.01 var(--serif);letter-spacing:-.035em;margin:20px 0 26px;max-width:900px;color:#fff}
.hero h1 em,.page-top h1 em,h2 em{color:inherit;font-style:italic;font-weight:400}
.hero-lede{color:#d5dde1;max-width:620px;font-size:17px;line-height:1.7}
.hero-actions{margin-top:34px;gap:22px}.button{border-radius:2px;padding:14px 20px;letter-spacing:.015em}.button-light{background:#fff;color:#102b3b;box-shadow:none;border:1px solid #fff}.button-light:hover{background:#edf2f4}.text-link.light-link{color:#f2f5f6;border-bottom:1px solid #8ea4af;padding-bottom:4px}
.hero-aside{width:190px;border-top:1px solid #78909b;margin-bottom:74px;padding-top:18px}.hero-index{color:#d8c39c}.hero-aside-line{display:none}.hero-aside p{color:#b8c5ca;font-size:11px;line-height:1.7}
.hero-scroll{bottom:23px;color:#a9b8bf}.hero-scroll span{background:var(--gold)}
.hero-meta{display:flex;flex-wrap:wrap;gap:0;margin-top:30px;padding-top:20px;border-top:1px solid #ffffff25;max-width:720px}
.hero-meta span{font-size:10px;line-height:1.2;text-transform:uppercase;letter-spacing:.1em;color:#b9c7cd;padding:0 14px;border-right:1px solid #ffffff25}
.hero-meta span:first-child{padding-left:0}.hero-meta span:last-child{border-right:0}

/* Sections */
.section-pad{padding:104px 0}.manifesto,.modules-section,.team-teaser{position:relative}
.section-label{color:var(--gold);font-family:var(--sans);font-weight:700}.section-label i{background:var(--gold);width:42px}
.eyebrow{color:#7d5e28;font-family:var(--sans);font-weight:700;letter-spacing:.14em}
.manifesto-copy h2,.section-heading-row h2,.team-teaser h2{font:700 clamp(36px,4vw,54px)/1.08 var(--serif);letter-spacing:-.025em}
.manifesto-copy p{color:#52636c;line-height:1.8}
.arrow-link{border-bottom:2px solid var(--gold);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.manifesto-stamp{border:1px solid #9caeb6;width:176px;height:176px;color:#17384a;border-radius:50%;transform:none;box-shadow:none;background:#fff}.manifesto-stamp span{font-family:var(--serif);font-weight:700}

/* Homepage module cards */
.module-card{background:#fff;border:1px solid #ccd6db;border-radius:3px;min-height:340px;padding:27px 25px 24px;box-shadow:0 6px 20px #0b263508;transition:border-color .18s,box-shadow .18s,transform .18s}
.module-card:after{display:none}.module-card:hover{transform:translateY(-3px);border-color:#8fa3ad;box-shadow:0 12px 24px #0b263510;background:#fff}
.module-card:nth-child(4){background:var(--institutional);border-color:var(--institutional);color:#fff}
.module-icon,.row-icon{border-radius:2px!important;background:#edf2f4!important;color:#17384a!important;border:1px solid #d4dde1}
.module-card:nth-child(4) .module-icon{background:#ffffff10!important;color:#fff!important;border-color:#ffffff2b}
.module-card h3{font-family:var(--serif);font-weight:700;letter-spacing:-.02em}.module-number{color:#8b672d!important;font-weight:700}

/* Internal page headers */
.page-top{padding:84px 0 78px;border-bottom:4px solid var(--gold)}
.page-top.band-sand,.page-top.band-sage,.page-top.band-ochre,.page-top.band-coral,.page-top.band-ink{background:var(--institutional)!important}
.page-top h1{font:700 clamp(44px,5.4vw,70px)/1.04 var(--serif);letter-spacing:-.035em;color:#fff!important;max-width:930px}
.page-top p{color:#cdd8dd;max-width:680px;line-height:1.75}.page-top .eyebrow{color:#d8c39c}
.head-icon{border-radius:2px!important;background:#ffffff0f!important;border:1px solid #ffffff25;color:#fff!important}
.inner-content{padding-top:72px;padding-bottom:100px}.detail-intro{max-width:780px;border-left:3px solid var(--gold);padding-left:28px}.detail-intro h2{font:700 42px/1.12 var(--serif);letter-spacing:-.025em}.detail-intro p{line-height:1.8}
.folder-callout{border:1px solid #cbd5da;border-radius:2px;background:#fff;box-shadow:none}.folder-callout-icon{border-radius:2px!important}

/* Module directory + expandable categories */
.full-module-list.category-tabs{border-top:1px solid #aebdc4;margin-top:38px}
.category-tabs .module-row{border-radius:0!important;border:0!important;border-bottom:1px solid #c8d3d8!important;background:transparent!important;box-shadow:none!important;padding:22px 14px!important;grid-template-columns:62px 54px 1fr 170px!important;transition:background .18s,color .18s,border .18s!important}
.category-tabs .module-row:hover{background:#eef2f3!important;transform:none!important}
.category-tabs .module-row.is-active{background:var(--institutional)!important;color:#fff!important;border-bottom-color:var(--institutional)!important}
.category-tabs .module-row .row-number{font:700 11px var(--sans);letter-spacing:.08em;color:#8a662f}
.category-tabs .module-row.is-active .row-number{color:#d8c39c}
.category-tabs .module-row .row-copy strong{font:700 25px/1.15 var(--serif);letter-spacing:-.018em}
.category-tabs .module-row .row-copy>span:last-child{font-size:12px;color:#65757e;line-height:1.5}.category-tabs .module-row.is-active .row-copy>span:last-child{color:#c8d4d9}
.category-tabs .module-row .row-action{font:700 10px var(--sans);letter-spacing:.07em;text-transform:uppercase;color:#42545f}
.category-tabs .module-row.is-active .row-action{color:#fff}.category-tabs .module-row .row-action svg{border:1px solid #bdc9cf;width:28px;height:28px;padding:7px;border-radius:1px}.category-tabs .module-row.is-active .row-action svg{border-color:#ffffff55}
.category-tabs .module-row .row-icon{width:46px;height:46px}
.category-panel{border:0!important;border-bottom:1px solid #b9c7cd!important;border-radius:0!important;background:#f0f3f4!important;margin:0!important;box-shadow:inset 0 1px 0 #fff!important}
.category-panel-clip{border-radius:0!important}.category-panel-inner{padding:34px 38px 36px!important}
.category-panel-head{border-bottom:1px solid #c5d0d5;padding-bottom:22px;margin-bottom:22px}.category-panel-head h3{font:700 30px/1.15 var(--serif);letter-spacing:-.02em}.category-panel-head p{color:#5b6c75;line-height:1.65}.panel-label{color:#836125!important;font:700 9px var(--sans)!important;letter-spacing:.14em!important}.category-count{border:1px solid #b5c3c9!important;border-radius:1px!important;color:#4f616b!important;background:#fff!important;font-weight:700!important}
.category-doc-grid{gap:10px!important}.category-doc-card{border:1px solid #cbd5da!important;border-radius:2px!important;background:#fff!important;box-shadow:none!important;min-height:90px!important;padding:17px 18px!important}.category-doc-card:hover{border-color:#879ca6!important;transform:none!important;background:#fbfcfc!important}.category-doc-card strong{font-family:var(--serif)!important;font-size:16px!important;line-height:1.35!important}.category-doc-card small{color:#6a7880!important}.doc-badge{border-radius:1px!important;background:#edf1f2!important;color:#17384a!important;border:1px solid #d2dade!important;font-family:var(--sans)!important;font-weight:800!important}.doc-arrow{color:#8a662f!important}.category-panel-foot{border-top:1px solid #c5d0d5!important;color:#6c7980!important}.category-full-link{font-weight:700!important;color:#17384a!important;text-transform:uppercase;letter-spacing:.055em;font-size:10px!important}

/* Catalog accordions */
.catalog-group{border:1px solid #c8d3d8!important;border-radius:2px!important;background:#fff!important;margin-top:16px!important;overflow:hidden}.catalog-heading{background:#f1f4f5!important;border-bottom:1px solid #d0d9dd!important;padding:18px 20px!important}.catalog-heading:hover{background:#e9eef0!important}.catalog-heading h3,.catalog-heading strong{font-family:var(--serif)!important;font-weight:700!important}.catalog-item{border-radius:0!important}

/* Footer */
.site-footer{background:#0b2635!important;border-top:4px solid var(--gold)}.footer-grid{padding-top:58px}.site-footer .brand-mark{background:#fff;color:#0b2635;border-color:#fff}.footer-links .eyebrow{color:#d8c39c}.footer-links a{color:#d3dde1}.footer-bottom{border-color:#ffffff20;color:#94a6ae}

/* Accessibility / utility */
a:focus-visible,button:focus-visible,[role="button"]:focus-visible{outline:3px solid #c99d51!important;outline-offset:3px!important}
.institutional-breadcrumb{display:flex;align-items:center;gap:9px;color:#73828a;font-size:10px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:24px;font-weight:700}.institutional-breadcrumb b{color:#17384a}.institutional-breadcrumb i{width:18px;height:1px;background:#a9b7bd;display:block}

@media(max-width:900px){
  .container,.nav-shell,.hero-inner,.institutional-bar-inner{width:min(100% - 48px,1240px)}
  .institutional-bar-inner{font-size:9px}.institutional-bar span:last-child{display:none}
  .hero-copy{padding-left:24px}.hero-aside{display:none}
  .category-tabs .module-row{grid-template-columns:52px 1fr 140px!important}.category-tabs .module-row .row-icon{display:none}.category-tabs .module-row .row-copy{grid-column:2}.category-tabs .module-row .row-action{grid-column:3}
}
@media(max-width:700px){
  .container,.nav-shell,.hero-inner,.institutional-bar-inner{width:min(100% - 32px,1240px)}
  .institutional-bar{min-height:30px}.site-header.has-institutional-bar .nav-shell{height:76px}
  .brand{min-width:0}.brand-mark{width:40px;height:40px}.brand-text strong{font-size:14px}
  .hero{min-height:auto}.hero-inner{min-height:0;padding:68px 0 76px}.hero-copy{border-left:2px solid var(--gold);padding-left:18px}.hero h1{font-size:43px}.hero-lede{font-size:15px}.hero-meta{gap:10px}.hero-meta span{border:0;padding:0 10px 0 0}
  .section-pad{padding:78px 0}.manifesto-stamp{display:none}.split-layout{grid-template-columns:42px 1fr!important}
  .page-top{padding:66px 0 60px}.page-top h1{font-size:43px}.inner-content{padding-top:54px}.detail-intro{padding-left:18px}
  .category-tabs .module-row{grid-template-columns:42px 1fr!important;padding:20px 8px!important}.category-tabs .module-row .row-copy{grid-column:2}.category-tabs .module-row .row-action{grid-column:2;justify-content:flex-start;margin-top:8px}.category-tabs .module-row .row-copy strong{font-size:23px}.category-panel-inner{padding:28px 16px 30px!important}
}
@media(max-width:480px){
  .institutional-bar-inner span:first-child{font-size:8px}.hero h1,.page-top h1{font-size:38px}.hero-actions{align-items:flex-start;flex-direction:column;gap:16px}.hero-meta{display:none}.category-doc-card{grid-template-columns:42px 1fr 18px!important;padding:14px!important}
}
</style>
<script id="institutional-v4-script">
(function(){
  function applyInstitutionalUI(){
    const header=document.querySelector('.site-header');
    if(header && !header.classList.contains('has-institutional-bar')){
      header.classList.add('has-institutional-bar');
      const bar=document.createElement('div');
      bar.className='institutional-bar';
      bar.innerHTML='<div class="institutional-bar-inner"><span><strong>Projeto APP</strong> · O Legislativo e a Avaliação de Políticas Públicas</span><span>GPE-CD · Consultoria Legislativa</span></div>';
      header.prepend(bar);
    }
    const heroCopy=document.querySelector('.hero .hero-copy');
    if(heroCopy && !heroCopy.querySelector('.hero-meta')){
      const meta=document.createElement('div');
      meta.className='hero-meta';
      meta.innerHTML='<span>Pesquisa aplicada</span><span>Avaliação de políticas públicas</span><span>Documentação pública</span>';
      const actions=heroCopy.querySelector('.hero-actions');
      if(actions) actions.insertAdjacentElement('afterend',meta); else heroCopy.appendChild(meta);
    }
    document.querySelectorAll('.inner-page .inner-content').forEach(area=>{
      if(area.querySelector(':scope > .institutional-breadcrumb')) return;
      const pageTitle=document.querySelector('.inner-page .page-top h1');
      if(!pageTitle) return;
      const crumb=document.createElement('div');
      crumb.className='institutional-breadcrumb';
      crumb.innerHTML='<b>Projeto APP</b><i></i><span>'+pageTitle.textContent.trim()+'</span>';
      area.prepend(crumb);
    });
    document.querySelectorAll('.category-tabs .module-row .row-action').forEach(action=>{
      [...action.childNodes].forEach(n=>{
        if(n.nodeType===3 && n.textContent.trim()!=='Abrir categoria') n.textContent='Abrir categoria ';
      });
    });
  }
  let frame=0;
  function schedule(){cancelAnimationFrame(frame);frame=requestAnimationFrame(applyInstitutionalUI)}
  document.addEventListener('DOMContentLoaded',schedule);
  new MutationObserver(schedule).observe(document.documentElement,{childList:true,subtree:true});
  window.addEventListener('popstate',()=>setTimeout(schedule,20));
})();
</script>
